<!-- سلة الطلبات + واتساب -->
<div id="cartBar" style="position:fixed;bottom:0;left:0;right:0;background:#111;color:#fff;padding:12px;text-align:center;z-index:9999;display:none;direction:rtl">
<div id="cartText" style="margin-bottom:8px;font-weight:bold"></div>
<input id="custName" placeholder="اسمك" style="padding:8px;width:30%;border-radius:8px;border:none">
<input id="custPhone" placeholder="رقم موبايلك" style="padding:8px;width:30%;border-radius:8px;border:none">
<input id="custAddr" placeholder="العنوان" style="padding:8px;width:30%;border-radius:8px;border:none">
<br><br>
<button onclick="sendOrder()" style="background:#25D366;color:#fff;border:none;padding:12px 20px;border-radius:10px;font-weight:bold;font-size:16px;width:90%">تأكيد الطلب على واتساب ✅</button>
</div>
<script>
let cart = {};
function getItems(){
  return [...document.querySelectorAll('.item, .card, .product, .menu-item')];
}
function addBtns(){
  getItems().forEach(el=>{
    if(el.querySelector('.addBtn')) return;
    let name = el.querySelector('h3,h4,.name')?.innerText || el.innerText.split('\n')[0];
    let priceText = el.innerText.match(/(\d+)\s*(ج|جنيه|EGP)?/);
    let price = priceText ? parseInt(priceText[1]) : 0;
    let b = document.createElement('div');
    b.innerHTML = `<div style="display:flex;gap:8px;justify-content:center;margin-top:8px"><button class="addBtn" style="background:#f97316;color:#fff;border:none;padding:8px 16px;border-radius:8px;font-weight:bold">+ أضف للطلب</button></div>`;
    b.querySelector('button').onclick = ()=>{
      cart[name] = cart[name] || {price:price, qty:0};
      cart[name].qty++;
      updateCart();
    };
    el.appendChild(b);
  });
}
function updateCart(){
  let total=0, txt='';
  for(let k in cart){ total+=cart[k].price*cart[k].qty; txt+=cart[k].qty+'x '+k+' - '+(cart[k].price*cart[k].qty)+'ج | '; }
  let bar=document.getElementById('cartBar');
  if(total>0){ bar.style.display='block'; document.getElementById('cartText').innerText = txt + ' | الاجمالي: '+total+' ج'; }
  else bar.style.display='none';
}
function sendOrder(){
  let name=document.getElementById('custName').value||'بدون اسم';
  let phone=document.getElementById('custPhone').value||'---';
  let addr=document.getElementById('custAddr').value||'---';
  let msg='طلب جديد من موقع فيتامين 🥤%0A%0A';
  for(let k in cart){ msg+=cart[k].qty+'x '+k+' - '+(cart[k].price*cart[k].qty)+' ج%0A'; }
  let total=0; for(let k in cart) total+=cart[k].price*cart[k].qty;
  msg+='%0Aالاجمالي: '+total+' ج%0Aالاسم: '+name+'%0Aرقم الزبون: '+phone+'%0Aالعنوان: '+addr;
  window.open('https://wa.me/201060747524?text='+msg,'_blank');
}
setInterval(addBtns,1000);
</script>
