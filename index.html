const tabs=document.getElementById('tabs');
const content=document.getElementById('content');
data.forEach((sec,i)=>{
let b=document.createElement('button');
b.className='tab'+(i==0?' active':'');
b.textContent=sec.name;
b.onclick=()=>{document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));document.getElementById('sec'+i).classList.add('active');window.scrollTo({top:0,behavior:'smooth'});};
tabs.appendChild(b);
let div=document.createElement('div');
div.className='section'+(i==0?' active':'');
div.id='sec'+i;
let title=document.createElement('div');
title.className='sec-title';
title.textContent=sec.name;
div.appendChild(title);
sec.items.forEach(it=>{
let card=document.createElement('div');
card.className='card';
let left=document.createElement('div');
left.innerHTML='<b>'+it[0]+'</b>'+(it[1]?'<small>'+it[1]+'</small>':'');
let pr=document.createElement('div');
pr.className='prices';
let labels=sec.name.includes('شرقية')?['صغير','وسط','كبير','لتر']:(it[2].length==1?['السعر']:(it[2].length==4?['صغير','وسط','كبير','لتر']:['وسط','كبير','لتر']));
it[2].forEach((p,idx)=>{let d=document.createElement('div');d.className='price'+(it[2].length==1?' single':'');d.innerHTML='<span>'+labels[idx]+'</span><b>'+p+'</b>';pr.appendChild(d);});
card.appendChild(left);
card.appendChild(pr);
let adds=document.createElement('div');
adds.className='adds';
it[2].forEach((p,idx)=>{let ab=document.createElement('button');ab.className='add-btn';ab.textContent='أضف '+labels[idx]+' +';ab.onclick=()=>addToCart(it[0],labels[idx],p);adds.appendChild(ab);});
card.appendChild(adds);
div.appendChild(card);
});
content.appendChild(div);
