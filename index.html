<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VITAMIN - Healthy Food</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,sans-serif}
body{background:#f7f5ef;color:#222}
header{background:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10;box-shadow:0 2px 10px rgba(0,0,0,.06)}
.logo{font-weight:900;font-size:22px;letter-spacing:1px}
.logo span{color:#7a9a3d}
.cart-btn{background:#222;color:#fff;border:0;padding:9px 14px;border-radius:999px;font-weight:700;cursor:pointer}
.hero{background:#eef2df;padding:28px 18px;text-align:center}
.hero h1{font-size:34px;line-height:1.2}
.hero h1 span{color:#7a9a3d}
.hero p{margin-top:10px;color:#666}
.hero button{margin-top:16px;background:#7a9a3d;color:#fff;border:0;padding:12px 22px;border-radius:999px;font-weight:800;cursor:pointer}
.tabs{display:flex;gap:8px;padding:14px;overflow:auto}
.tabs button{border:0;background:#fff;padding:10px 16px;border-radius:999px;white-space:nowrap;cursor:pointer;font-weight:700}
.tabs button.active{background:#222;color:#fff}
.section{padding:4px 16px 90px}
.section h2{font-size:22px;margin:14px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 4px 14px rgba(0,0,0,.05)}
.card img{width:100%;height:130px;object-fit:cover}
.card-body{padding:10px}
.card-body h3{font-size:15px}
.card-body p{font-size:12px;color:#777;margin:4px 0 8px}
.row{display:flex;justify-content:space-between;align-items:center}
.price{font-weight:900;color:#7a9a3d}
.add{background:#222;color:#fff;border:0;padding:7px 12px;border-radius:999px;font-weight:700;cursor:pointer}
#cartBar{position:fixed;bottom:0;left:0;right:0;background:#222;color:#fff;padding:12px 14px;display:none;justify-content:space-between;align-items:center;z-index:20}
#cartBar button{background:#7a9a3d;color:#fff;border:0;padding:10px 16px;border-radius:999px;font-weight:800;cursor:pointer}
#cartBox{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:30;align-items:flex-end}
#cartBox.open{display:flex}
.cart-sheet{background:#fff;width:100%;max-height:80vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px}
.cart-sheet h3{margin-bottom:10px}
.cart-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #eee}
.qty button{width:28px;height:28px;border:1px solid #ddd;background:#fff;border-radius:50%;cursor:pointer}
.wa{display:block;text-align:center;background:#25D366;color:#fff;padding:13px;border-radius:14px;text-decoration:none;font-weight:800;margin-top:14px}
.close{width:100%;padding:10px;border:0;background:#eee;border-radius:12px;margin-top:8px;cursor:pointer}
</style>
</head>
<body>

<header>
<div class="logo">VITAMIN<span>.</span></div>
<button class="cart-btn" onclick="openCart()">🛒 السلة (<span id="count">0</span>)</button>
</header>

<div class="hero">
<h1>أكل صحي، <span>طعمه حلو</span></h1>
<p>فريش كل يوم - بدون سكر مضاف</p>
<button onclick="document.getElementById('menu').scrollIntoView({behavior:'smooth'})">شوف المنيو</button>
</div>

<div class="tabs" id="menu">
<button class="active" onclick="filterCat('all',this)">الكل</button>
<button onclick="filterCat('bowls',this)">Bowls</button>
<button onclick="filterCat('salads',this)">Salads</button>
<button onclick="filterCat('drinks',this)">Drinks</button>
<button onclick="filterCat('desserts',this)">Desserts</button>
</div>

<div class="section">
<h2>المميز</h2>
<div class="grid" id="grid"></div>
</div>

<div id="cartBar">
<div>🛒 <span id="barCount">0</span> صنف - <b><span id="barTotal">0</span> ج</b></div>
<button onclick="openCart()">عرض السلة</button>
</div>

<div id="cartBox" onclick="if(event.target==this) closeCart()">
<div class="cart-sheet">
<h3>سلتك 🛒</h3>
<div id="items"></div>
<p id="empty" style="color:#888">السلة فاضية لسه</p>
<h3 style="margin-top:14px">الإجمالي: <span id="total">0</span> ج</h3>
<a class="wa" id="waLink" target="_blank" href="#">اطلب على واتساب</a>
<button class="close" onclick="closeCart()">قفل</button>
</div>
</div>

<script>
const items=[
{id:1,cat:'bowls',name:'Protein Bowl',desc:'فراخ + كينوا + خضار',price:180,img:'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=600'},
{id:2,cat:'bowls',name:'Avocado Bowl',desc:'أفوكادو + بيض + توست',price:150,img:'https://images.unsplash.com/photo-1540189549336-e6e99c4299bd?w=600'},
{id:3,cat:'salads',name:'Caesar Salad',desc:'خس + فراخ + صوص',price:120,img:'https://images.unsplash.com/photo-1512621776951-a57141f2eefd?w=600'},
{id:4,cat:'salads',name:'Quinoa Salad',desc:'كينوا + خضار فريش',price:110,img:'https://images.unsplash.com/photo-1505253758473-96b7015fcd40?w=600'},
{id:5,cat:'drinks',name:'Green Smoothie',desc:'سبانخ + موز + تفاح',price:90,img:'https://images.unsplash.com/photo-1610970881699-44a5587cabec?w=600'},
{id:6,cat:'drinks',name:'Berry Smoothie',desc:'توت + زبادي + عسل',price:95,img:'https://images.unsplash.com/photo-1638176066666-ffb2f013c7dd?w=600'},
{id:7,cat:'desserts',name:'Oat Pancakes',desc:'شوفان + عسل + فواكه',price:100,img:'https://images.unsplash.com/photo-1567620905732-2d1ec7ab7445?w=600'},
{id:8,cat:'desserts',name:'Chia Pudding',desc:'شيا + حليب + مانجو',price:85,img:'https://images.unsplash.com/photo-1488477181946-6428a0291777?w=600'},
];
let cart={};
let current='all';
function render(){
const g=document.getElementById('grid');
g.innerHTML='';
items.filter(i=>current=='all'||i.cat==current).forEach(i=>{
g.innerHTML+=`<div class="card"><img src="${i.img}"><div class="card-body"><h3>${i.name}</h3><p>${i.desc}</p><div class="row"><span class="price">${i.price} ج</span><button class="add" onclick="add(${i.id})">أضف +</button></div></div></div>`;
});
}
function filterCat(c,btn){current=c;document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');render();}
function add(id){cart[id]=(cart[id]||0)+1;update();}
function change(id,d){cart[id]=(cart[id]||0)+d;if(cart[id]<=0) delete cart[id];update();}
function update(){
let count=0,total=0,html='';
for(let id in cart){let it=items.find(x=>x.id==id);let q=cart[id];count+=q;total+=it.price*q;
html+=`<div class="cart-item"><div><b>${it.name}</b><br><span style="color:#888">${it.price} ج</span></div><div class="qty"><button onclick="change(${id},-1)">-</button> <b>${q}</b> <button onclick="change(${id},1)">+</button></div></div>`;}
document.getElementById('count').innerText=count;
document.getElementById('barCount').innerText=count;
document.getElementById('barTotal').innerText=total;
document.getElementById('total').innerText=total;
document.getElementById('items').innerHTML=html;
document.getElementById('empty').style.display=count?'none':'block';
document.getElementById('cartBar').style.display=count?'flex':'none';
let msg='أهلاً VITAMIN، عايز أطلب:%0A';
for(let id in cart){let it=items.find(x=>x.id==id);msg+=`- ${it.name} x${cart[id]} = ${it.price*cart[id]} ج%0A`;}
msg+=`الإجمالي: ${total} ج`;
document.getElementById('waLink').href='https://wa.me/201064066262?text='+msg;
}
function openCart(){update();document.getElementById('cartBox').classList.add('open');}
function closeCart(){document.getElementById('cartBox').classList.remove('open');}
render();update();
</script>
</body>
</html>
