<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VITAMIN JUICE</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#fdf6e9;padding:15px}
header{background:#1a7a3a;color:#fff;text-align:center;padding:20px 10px;border-radius:15px}
header h1{font-size:32px;letter-spacing:1px}
header p{margin-top:5px;opacity:.9}
.cart-btn{position:fixed;top:15px;left:15px;background:#ff7a00;color:#fff;border:none;padding:12px 16px;border-radius:50px;font-size:16px;font-weight:bold;cursor:pointer;z-index:100;box-shadow:0 4px 10px rgba(0,0,0,.2)}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}
.card{background:#fff;border-radius:15px;padding:12px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.card h3{font-size:18px;margin:8px 0 4px}
.card p{font-size:13px;color:#777}
.price{color:#e67e00;font-weight:bold;font-size:18px;margin:6px 0}
.add{background:#1a7a3a;color:#fff;border:none;padding:9px;width:100%;border-radius:10px;font-size:15px;cursor:pointer}
.add:active{background:#145c2c}
.drawer{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:none;z-index:200}
.drawer.open{display:block}
.sheet{background:#fff;position:absolute;bottom:0;left:0;right:0;max-height:85%;border-radius:20px 20px 0 0;padding:18px;overflow:auto}
.sheet h2{margin-bottom:12px}
.item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #eee}
.item b{font-size:15px}
.qty{display:flex;gap:8px;align-items:center}
.qty button{width:30px;height:30px;border-radius:50%;border:1px solid #ddd;background:#f5f5f5;font-size:18px;cursor:pointer}
.total{font-size:20px;font-weight:bold;margin:15px 0;text-align:left}
.wa{background:#25D366;color:#fff;border:none;padding:14px;width:100%;border-radius:12px;font-size:18px;font-weight:bold;cursor:pointer}
.close{background:#eee;border:none;padding:10px;width:100%;border-radius:10px;margin-top:8px;cursor:pointer}
.empty{text-align:center;color:#888;padding:20px}
@media(max-width:400px){.menu{grid-template-columns:1fr}}
</style>
</head>
<body>

<button class="cart-btn" onclick="openCart()">🛒 السلة (<span id="count">0</span>)</button>

<header>
<h1>VITAMIN JUICE</h1>
<p>عصائر طبيعية 100% - طازة كل يوم</p>
</header>

<div class="menu" id="menu"></div>

<div class="drawer" id="drawer">
<div class="sheet">
<h2>🛒 سلة الطلبات</h2>
<div id="cartItems"></div>
<div class="total" id="total"></div>
<button class="wa" onclick="orderWhats()">اطلب على واتساب ✅</button>
<button class="close" onclick="closeCart()">قفل</button>
</div>
</div>

<script>
const products=[
{name:"عصير برتقال",price:35,desc:"برتقال طازة"},
{name:"عصير مانجو",price:50,desc:"مانجو طبيعي"},
{name:"عصير فراولة",price:45,desc:"فراولة فريش"},
{name:"عصير كيوي",price:55,desc:"كيوي طازة"},
{name:"عصير جوافة",price:40,desc:"جوافة طبيعية"},
{name:"عصير موز باللبن",price:45,desc:"موز + لبن"},
{name:"عصير تفاح",price:50,desc:"تفاح فريش"},
{name:"عصير أناناس",price:55,desc:"أناناس طازة"},
{name:"عصير ليمون بالنعناع",price:35,desc:"ليمون + نعناع"},
{name:"عصير بطيخ",price:40,desc:"بطيخ ساقع"},
{name:"عصير رمان",price:55,desc:"رمان طبيعي"},
{name:"عصير خوخ",price:45,desc:"خوخ فريش"},
];
let cart={};
function renderMenu(){
document.getElementById('menu').innerHTML=products.map((p,i)=>`
<div class="card">
<h3>${p.name}</h3>
<p>${p.desc}</p>
<div class="price">${p.price} ج</div>
<button class="add" onclick="addToCart(${i})">أضف للسلة +</button>
</div>`).join('');
}
function addToCart(i){
cart[i]=(cart[i]||0)+1;
updateCart();
alert(products[i].name+" اتضاف للسلة ✅");
}
function updateCart(){
let c=Object.values(cart).reduce((a,b)=>a+b,0);
document.getElementById('count').innerText=c;
let html="",total=0;
for(let i in cart){
let p=products[i],q=cart[i],sub=p.price*q;total+=sub;
html+=`<div class="item"><div><b>${p.name}</b><br>${p.price} ج × ${q} = ${sub} ج</div><div class="qty"><button onclick="changeQty(${i},-1)">-</button><b>${q}</b><button onclick="changeQty(${i},1)">+</button></div></div>`;
}
if(!html) html='<div class="empty">السلة فاضية، ضيف حاجة الأول</div>';
document.getElementById('cartItems').innerHTML=html;
document.getElementById('total').innerText=total?`الإجمالي: ${total} ج`:'';
}
function changeQty(i,d){
cart[i]+=d; if(cart[i]<=0) delete cart[i]; updateCart();
}
function openCart(){updateCart();document.getElementById('drawer').classList.add('open');}
function closeCart(){document.getElementById('drawer').classList.remove('open');}
function orderWhats(){
if(Object.keys(cart).length==0){alert('السلة فاضية!');return;}
let msg="أهلاً، عايز أطلب من VITAMIN JUICE:%0A%0A";
let total=0;
for(let i in cart){let p=products[i],q=cart[i],sub=p.price*q;total+=sub;msg+=`- ${p.name} × ${q} = ${sub} ج%0A`;}
msg+=`%0Aالإجمالي: ${total} ج%0A%0Aالاسم: %0Aالعنوان: %0Aرقم التليفون: `;
window.open("https://wa.me/201060747524?text="+msg,"_blank");
}
renderMenu();
</script>
</body>
</html>
